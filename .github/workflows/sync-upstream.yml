name: Sync upstream

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/anthropics/skills.git
          git fetch upstream main

      - name: Merge upstream main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # keep our marketplace catalog on conflict; upstream's is not ZCode-format
          git config merge.keep-ours.driver true
          git merge upstream/main --no-edit

      - name: Sync manifests and bump versions when skills changed
        run: |
          if git diff --name-only 'HEAD@{1}' HEAD | grep -q '^skills/'; then
            for f in skills/*/.zcode-plugin/plugin.json; do
              old=$(jq -r .version "$f")
              IFS=. read -r a b c <<< "$old"
              new="$a.$b.$((c + 1))"
              jq --arg v "$new" '.version = $v' "$f" > tmp.json && mv tmp.json "$f"
            done
            node scripts/generate-marketplace.mjs
            git add skills .claude-plugin/marketplace.json
            git diff --cached --quiet || git commit -m "chore: bump skill plugin versions (upstream sync)"
          fi

      - name: Push
        run: git push
